# Runs the fridge behind Caddy, which gets a TLS certificate on its own.
# Everything stateful lives in Supabase, so this stack keeps no volumes
# beyond Caddy's certificates — losing the host loses nothing.
services:
  fridge:
    build: .
    restart: unless-stopped
    env_file: [server/.env]
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [fridge]

volumes:
  caddy-data:
  caddy-config:
