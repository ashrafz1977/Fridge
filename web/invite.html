<title>The Family Fridge</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="/fridge.css">
<link rel="stylesheet" href="/auth.css">

<div class="door-edge" aria-hidden="true"></div>

<main class="gate">
  <div class="card">
    <p class="mark">You have been invited</p>
    <h1 id="heading">Loading the invitation…</h1>
    <p class="lede" id="lede"></p>

    <p class="notice bad" id="notice" hidden></p>

    <!-- Signed in already: one button and you are in. -->
    <div id="accept" hidden>
      <div class="who-strip">
        <span class="dot" id="who-dot" aria-hidden="true"></span>
        <span id="who-name"></span>
        <button class="btn ghost swap" type="button" id="signout">Not you?</button>
      </div>
      <button class="btn wide" type="button" id="join">Join the fridge</button>
    </div>

    <!-- Not signed in: the same three ways in, carrying the token. -->
    <div id="gate" hidden>
      <div class="providers">
        <a class="provider" id="google" href="#">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 2-1.5 5-4.4 7l-.1.3 6.4 5 .4.1c4.1-3.8 6.8-9.4 6.8-16"/>
            <path fill="#34A853" d="M24 46c5.9 0 10.8-1.9 14.4-5.3l-6.8-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-.3.1-6.6 5-.1.3C7.9 41 15.4 46 24 46"/>
            <path fill="#FBBC05" d="M11.5 28.5c-.5-1.4-.7-2.9-.7-4.5s.3-3.1.7-4.5v-.3l-6.9-5.3-.2.1C2.8 17 2 20.4 2 24s.8 7 2.4 10.1z"/>
            <path fill="#EA4335" d="M24 10.2c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.8 4 29.9 2 24 2 15.4 2 7.9 7 4.4 13.9l7.1 5.6C13.3 14 18.2 10.2 24 10.2"/>
          </svg>
          <span>Continue with Google</span>
        </a>
        <a class="provider apple" id="apple" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.37 12.78c.02 2.63 2.31 3.5 2.34 3.52-.02.06-.37 1.26-1.22 2.5-.73 1.07-1.5 2.13-2.7 2.15-1.18.02-1.56-.7-2.9-.7-1.35 0-1.77.68-2.89.72-1.16.04-2.04-1.14-2.78-2.2-1.6-2.32-2.83-6.57-1.18-9.44.82-1.42 2.28-2.32 3.87-2.35 1.14-.02 2.21.77 2.9.77.69 0 2-.95 3.37-.81.57.02 2.18.21 3.21 1.57-.08.05-1.92 1.12-1.9 3.35M14.2 3.9c.61-.74 1.02-1.77.91-2.8-.88.04-1.95.59-2.58 1.33-.57.65-1.05 1.7-.92 2.71.98.07 1.98-.5 2.59-1.24"/>
          </svg>
          <span>Continue with Apple</span>
        </a>
      </div>

      <p class="rule">or</p>

      <form class="stack" id="form" novalidate>
        <div class="field">
          <label for="displayName">Your name</label>
          <input id="displayName" type="text" maxlength="40" autocomplete="name" required
                 placeholder="What the family calls you">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Choose a password</label>
          <input id="password" type="password" autocomplete="new-password" required placeholder="••••••••••">
          <span class="tip">At least 10 characters.</span>
        </div>
        <button class="btn wide" type="submit">Create account and join</button>
      </form>

      <p class="switcher">
        Already have an account? <button type="button" id="to-signin">Sign in instead</button>
      </p>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</main>

<script type="module" src="/invite.js"></script>
